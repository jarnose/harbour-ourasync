name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same script a developer runs: both language modes, -Werror.
      - name: Run the Qt-free test suites
        run: tests/run.sh

      # Catches what a C++ build cannot and a phone shows as a blank page:
      # duplicate signal handlers, ES6 syntax the Qt 5.6 QML engine rejects.
      - name: Check the QML
        run: python3 tools/check_qml.py

      # Every qsTr() must have its Finnish text, and the compiled catalogue
      # must have no unfinished entries.
      - name: Check the translations
        run: |
          sudo apt-get update && sudo apt-get install -y qttools5-dev-tools
          export PATH=/usr/lib/x86_64-linux-gnu/qt5/bin:$PATH
          lupdate -locations absolute -no-obsolete src qml -ts translations/harbour-ourasync.ts
          python3 tools/fill_fi.py
          git diff --exit-code -- translations
          lrelease translations/harbour-ourasync-fi.ts -qm /tmp/fi.qm | grep "0 unfinished"

  rpm:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl]
    steps:
      - uses: actions/checkout@v4
      - name: Build the RPM
        uses: coderus/github-sfos-build@sfos5
        with:
          release: 5.1.0.11
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: rpms
      - uses: softprops/action-gh-release@v2
        with:
          files: rpms/*.rpm
          body: |
            Unsigned RPMs built by GitHub Actions for Sailfish OS 5.1.0.11,
            aarch64 and armv7hl. Install with `devel-su pkcon install-local
            <file>.rpm`, which will warn that the package is untrusted. It is
            right: these are CI builds, not Store packages.
