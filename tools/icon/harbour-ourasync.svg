<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="172" height="172" viewBox="0 0 172 172">
  <!-- Sailfish OS app icon: one of the base shapes (a square whose corners are either quarter circles of
       half the side or nearly sharp, here two of each, the round ones across from each other), a gradient, and a flat metaphor inside:
       the ring, with a gauge arc and a pulse. 0.6 units of gap on each side, as the icon story asks. -->
  <defs>
    <linearGradient id="base" x1="0.08" y1="0.02" x2="0.92" y2="1">
      <stop offset="0" stop-color="#8A6AE6"/>
      <stop offset="0.55" stop-color="#5A5FDB"/>
      <stop offset="1" stop-color="#2D74D6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#E4D6F2"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD257"/>
      <stop offset="1" stop-color="#FF8F3A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="shape">
      <path id="outline" d="M 5.6 0.6 H 86 A 85.4 85.4 0 0 1 171.4 86 V 166.4 A 5 5 0 0 1 166.4 171.4 H 86 A 85.4 85.4 0 0 1 0.6 86 V 5.6 A 5 5 0 0 1 5.6 0.6 Z"/>
    </clipPath>
  </defs>

  <use xlink:href="#outline" fill="url(#base)"/>
  <g clip-path="url(#shape)">
    <rect x="0" y="0" width="172" height="86" fill="url(#shine)"/>
  </g>

  <!-- the ring and its shadow -->
  <circle cx="86" cy="90" r="42" fill="none" stroke="#1B1F6B" stroke-opacity="0.35" stroke-width="19" filter="url(#soft)"/>
  <circle cx="86" cy="86" r="42" fill="none" stroke="url(#ring)" stroke-width="19"/>
  <!-- the gauge arc over it: from the top round to about four o'clock, a little past two thirds -->
  <path d="M 86 44 A 42 42 0 1 1 61.3 120" fill="none" stroke="url(#arc)" stroke-width="19" stroke-linecap="round" transform="rotate(0 86 86)"/>
  <!-- a pulse in the middle -->
  <polyline points="64,88 75,88 80.5,74 88,101 94,82 98,88 108,88" fill="none" stroke="#ffffff" stroke-opacity="0.92"
            stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
